[project]
name = "traffic-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "osmnx>=2.0.0",
    "networkx>=3.0",
    "pyproj>=3.6.0",
    "websockets>=12.0",
    "pydantic>=2.4",
    "shapely>=2.0",
    "geojson>=3.0",
]

[project.optional-dependencies]
sumo = [
    "eclipse-sumo>=1.18.0",
    "traci>=1.18.0",
    "sumolib>=1.18.0",
]
